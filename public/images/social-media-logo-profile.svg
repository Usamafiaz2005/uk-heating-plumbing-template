<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" fill="none">
  <!-- Dark Obsidian Website Theme Background -->
  <rect width="1080" height="1080" fill="#0D1117" />
  
  <!-- Subtle Blueprint Architectural Grid Overlay -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#1E2730" stroke-width="1.5" opacity="0.6"/>
    </pattern>
    <radialGradient id="copperAmbient" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D68A3C" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tealAmbient" cx="50%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#3E7C7A" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="socialCopperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A855" />
      <stop offset="50%" stop-color="#D68A3C" />
      <stop offset="100%" stop-color="#B36A1F" />
    </linearGradient>
    <linearGradient id="socialTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CAAA7" />
      <stop offset="60%" stop-color="#3E7C7A" />
      <stop offset="100%" stop-color="#245452" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#D68A3C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Grids & Radial Glows -->
  <rect width="1080" height="1080" fill="url(#grid)" />
  <circle cx="540" cy="450" r="450" fill="url(#copperAmbient)" />
  <circle cx="540" cy="750" r="400" fill="url(#tealAmbient)" />

  <!-- EMBLEM SYMBOL (Center Scale) -->
  <g transform="translate(540, 420) scale(4.2)" filter="url(#logoGlow)">
    <g transform="translate(-70, -70)">
      <!-- Outer Contour Arch Frame -->
      <path d="M 70,6 C 48,22 18,42 8,78 C -2,114 18,130 34,134 L 106,134 C 122,130 142,114 132,78 C 122,42 92,22 70,6 Z" 
            fill="none" stroke="url(#socialTealGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Inner Contour Frame Ribbon -->
      <path d="M 70,16 C 52,30 26,48 16,81 C 8,108 24,125 36,127" 
            fill="none" stroke="url(#socialCopperGrad)" stroke-width="3" stroke-linecap="round"/>
      <path d="M 70,16 C 88,30 114,48 124,81 C 132,108 116,125 104,127" 
            fill="none" stroke="url(#socialCopperGrad)" stroke-width="3" stroke-linecap="round"/>

      <!-- Radiant Sun -->
      <circle cx="70" cy="40" r="7" fill="url(#socialCopperGrad)"/>
      <line x1="70" y1="27" x2="70" y2="23" stroke="url(#socialCopperGrad)" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="60" y1="31" x2="56" y2="28" stroke="url(#socialCopperGrad)" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="80" y1="31" x2="84" y2="28" stroke="url(#socialCopperGrad)" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="55" y1="40" x2="51" y2="40" stroke="url(#socialCopperGrad)" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="85" y1="40" x2="89" y2="40" stroke="url(#socialCopperGrad)" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Monogram A Arch -->
      <path d="M 27,126 C 29,98 44,62 62,47 C 65,44 67,47 64,54 C 52,78 41,102 37,126" 
            fill="url(#socialTealGrad)"/>
      <path d="M 39,126 C 44,98 57,74 70,57 C 72,54 75,56 73,62 C 62,83 50,106 47,126" 
            fill="url(#socialCopperGrad)"/>

      <!-- Eco Leaf Swoosh -->
      <path d="M 34,95 Q 55,87 73,74 Q 81,62 89,54 C 87,67 72,85 49,97 Z" 
            fill="url(#socialTealGrad)"/>
      <path d="M 39,93 Q 58,84 77,70" fill="none" stroke="#F6F4F0" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>

      <!-- City Skyline Buildings & Gherkin Tower -->
      <rect x="67" y="80" width="14" height="46" fill="url(#socialTealGrad)" rx="1.5"/>
      <rect x="70" y="84" width="3.5" height="4.5" fill="#0D1117" opacity="0.75"/>
      <rect x="75" y="84" width="3.5" height="4.5" fill="#0D1117" opacity="0.75"/>
      <rect x="70" y="92" width="3.5" height="4.5" fill="#0D1117" opacity="0.75"/>
      <rect x="75" y="92" width="3.5" height="4.5" fill="#0D1117" opacity="0.75"/>
      <rect x="70" y="100" width="3.5" height="4.5" fill="#0D1117" opacity="0.75"/>
      <rect x="75" y="100" width="3.5" height="4.5" fill="#0D1117" opacity="0.75"/>

      <rect x="83" y="70" width="13" height="56" fill="#3E7C7A" rx="1.5" opacity="0.9"/>
      <line x1="86" y1="74" x2="93" y2="74" stroke="#F6F4F0" stroke-width="1" opacity="0.6"/>
      <line x1="86" y1="80" x2="93" y2="80" stroke="#F6F4F0" stroke-width="1" opacity="0.6"/>
      <line x1="86" y1="86" x2="93" y2="86" stroke="#F6F4F0" stroke-width="1" opacity="0.6"/>
      <line x1="86" y1="92" x2="93" y2="92" stroke="#F6F4F0" strokeWidth="1" opacity="0.6"/>

      <path d="M 98,126 C 96,98 98,74 106,64 C 114,74 116,98 114,126 Z" fill="url(#socialCopperGrad)"/>
      <path d="M 99,118 L 112,88" stroke="#0D1117" stroke-width="1.2" opacity="0.55"/>
      <path d="M 99,103 L 113,74" stroke="#0D1117" stroke-width="1.2" opacity="0.55"/>
      <path d="M 113,118 L 100,88" stroke="#0D1117" stroke-width="1.2" opacity="0.55"/>

      <!-- Base Horizon Line -->
      <line x1="18" y1="128" x2="122" y2="128" stroke="url(#socialCopperGrad)" stroke-width="2.8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- BRAND NAME TYPOGRAPHY -->
  <text x="540" y="820" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="800" font-size="64" letter-spacing="-1">
    <tspan fill="#F6F4F0">ASSETCARE </tspan><tspan fill="#D68A3C">LONDON</tspan>
  </text>
  
  <!-- SERVICE TAGLINE SUBTITLE -->
  <text x="540" y="885" text-anchor="middle" font-family="'Space Grotesk', monospace" font-weight="700" font-size="24" letter-spacing="8" fill="#3E7C7A">
    HEATING • COOLING • SOLAR • PLUMBING
  </text>

  <!-- ACCREDITATION BADGE FOOTER -->
  <text x="540" y="960" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" letter-spacing="2" fill="#8B949E">
    COMPANIES HOUSE REG: 17167498 • NATIONWIDE UK COVERAGE
  </text>
</svg>
